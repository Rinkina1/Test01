<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survey Platform</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Survey Platform</h1>
      <p>ระบบเก็บข้อมูลแบบสอบถาม (SQLite backend)</p>
    </div>
    <div class="body">
      <h3 style="font-size: 16px; margin-bottom: 10px;">แบบสอบถามที่เปิดให้ตอบ</h3>
      <div id="alert"></div>
      <div id="surveys" class="survey-list">
        <div class="empty">กำลังโหลด...</div>
      </div>

      <hr style="margin: 28px 0; border: none; border-top: 1px solid #eee;">

      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <a class="btn" href="admin.html">เข้าสู่ระบบผู้ดูแล</a>
      </div>
      <p class="muted" style="margin-top: 12px;">
        ข้อมูลถูกเก็บใน SQLite (<code>data/survey.db</code>) — รัน <code>npm start</code> เพื่อเปิด server
      </p>
    </div>
  </div>

<script src="storage.js"></script>
<script>
function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function renderSurveys() {
  const box = document.getElementById('surveys');
  const alertBox = document.getElementById('alert');
  try {
    const surveys = await Store.getPublicSurveys();
    if (surveys.length === 0) {
      box.innerHTML = '<div class="empty">ยังไม่มีแบบสอบถามที่เปิดให้ตอบ — login เข้า admin เพื่อสร้าง</div>';
      return;
    }
    box.innerHTML = surveys.map((s) => `
      <div class="survey-card">
        <div style="flex:1; min-width:0;">
          <div class="title">${escapeHtml(s.title)}</div>
          <div class="meta">${s.field_count} คำถาม · ${s.response_count} คำตอบ</div>
        </div>
        <a class="btn sm" href="survey.html?slug=${encodeURIComponent(s.slug)}">เริ่มทำ →</a>
      </div>
    `).join('');
  } catch (err) {
    box.innerHTML = '';
    alertBox.innerHTML = `<div class="alert error">${escapeHtml(err.message)}</div>`;
  }
}

renderSurveys();
</script>
</body>
</html>
