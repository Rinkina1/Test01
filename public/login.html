<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link rel="stylesheet" href="styles.css">
<style>.container { max-width: 420px; }</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>เข้าสู่ระบบผู้ดูแล</h1>
      <p>Survey Platform Admin</p>
    </div>
    <div class="body">
      <div id="alert"></div>
      <form id="loginForm">
        <div class="field">
          <label for="username">Username<span class="required">*</span></label>
          <input type="text" id="username" name="username" required autocomplete="username" autofocus value="admin">
        </div>
        <div class="field">
          <label for="password">Password<span class="required">*</span></label>
          <input type="password" id="password" name="password" required autocomplete="current-password" value="admin123">
        </div>
        <button type="submit" class="btn lg" style="margin-top: 6px;">เข้าสู่ระบบ</button>
      </form>
      <p class="muted" style="margin-top: 14px; text-align: center;">
        Default: <code>admin</code> / <code>admin123</code>
      </p>
    </div>
  </div>

<script src="storage.js"></script>
<script>
if (Store.isLoggedIn()) location.href = 'admin.html';

document.getElementById('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('alert');
  alertBox.innerHTML = '';
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if (Store.login(u, p)) {
    location.href = 'admin.html';
  } else {
    alertBox.innerHTML = '<div class="alert error">username หรือ password ไม่ถูกต้อง</div>';
  }
});
</script>
</body>
</html>
